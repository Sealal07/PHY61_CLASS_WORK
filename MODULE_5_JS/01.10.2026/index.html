<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- submit -->
    <form id="loginForm">
        <input type="email"  name="email" required>
        <input type="password" name="pass" required>
        <button type="submit">Войти</button>
    </form>

    <!-- input -->
     <input type="search" id="search" placeholder="Поиск...">
     <p>Введено: <span id="len">0</span> символов</p>

     <!-- change -->
      <select id="city">
        <option value="">Выберите город</option>
        <option value="msk">Москва</option>
        <option value="nsk">Новосибирск</option>
      </select>

      <label><input type="checkbox" id="agree">
        Согласен с условиями
      </label>

      <!-- focus / blur -->
       <input id="phone" placeholder="+7 ___ ___-__-__">
       <span id="phoneError" class="error"></span>


       <!-- reset -->
        <form id="myForm">
            <input name="name" placeholder="Имя">
            <button type="reset">Очистить</button>
        </form>



        <!-- ЖИВАЯ СТОИМОСТЬ ЗАКАЗА -->
         <form id="order">
            <label>Количество: 
                <input type="number" id="qty" value="1" min="1">
            </label>
            <label>Доставка:
                <select id="delivery">
                    <option value="0">Самовывоз (0р.)</option>
                    <option value="300">Курьер (300р.)</option>
                </select>
            </label>
            <label><input type="checkbox" id="vip">
                VIP-упаковка (+500р)
            </label>
            <p>Итого: <strog id="total">1000р.</strog></p>
         </form>

    <script src="script.js"></script>
</body>
</html>
