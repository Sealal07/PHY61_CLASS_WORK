<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"  href="style.css">
</head>
<body>
    <!-- class - для создания групп -->
    <p class="text">Параграф 1</p>
    <!-- id - уникальное значение, это не цифры -->
    <p id="second">Параграф 2</p>
    <p>Параграф 3</p>
    <p class="text text_2">Параграф 4</p>
    <span class="text">Просто текст</span>
    <span class="text_2">Еще один просто текст</span>

    <!-- БЛОЧНЫЕ и СТРОЧНЫЕ ЭЛЕМЕНТЫ -->

    <div id="block">
        Блочная модель элемента
    </div>

    <div id="parent">
        <div id="child">Текст дочернего элемента</div>
    </div>

</body>
</html>
