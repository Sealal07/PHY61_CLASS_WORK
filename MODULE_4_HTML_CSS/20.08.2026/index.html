<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>КАРТОЧНЫЙ ПОРТАЛ</h1>
        <p class="bage">hover -> портал</p>
    </header>

    <div class="box">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <div class="gallery">
        <!-- КАРТОЧКА 1 START -->
         <div class="card">
            <img src="dragon.jpg">
            <div class="card_title">Дракон</div>
            <div class="card_portal">
                <h3>Дракон</h3>
                <p>Описание дракона...</p>
                <div>
                    <span class="tag">Огонь</span>
                    <span class="tag">Полет</span>
                    <span class="tag">Сокровища</span>
                </div>
            </div>
        </div>
        <!-- КАРТОЧКА 1 END  -->
         <!-- КАРТОЧКА 2 START -->
         <div class="card">
            <img src="elf.jpg">
            <div class="card_title">Эльф</div>
            <div class="card_portal">
                <h3>Эльф</h3>
                <p>Описание эльфа...</p>
                <div>
                    <span class="tag">Природа</span>
                    <span class="tag">Лук</span>
                    <span class="tag">Магия</span>
                </div>
            </div>
        </div>
        <!-- КАРТОЧКА 2 END  -->
         <!-- КАРТОЧКА 3 START -->
         <div class="card">
            <img src="mag.jpg">
            <div class="card_title">Маг</div>
            <div class="card_portal">
                <h3>Маг</h3>
                <p>Описание мага...</p>
                <div>
                    <span class="tag">Пророчество</span>
                    <span class="tag">Энергия</span>
                    <span class="tag">Космос</span>
                </div>
            </div>
        </div>
        <!-- КАРТОЧКА 3 END  -->
         <aside>
            <h4>Открытые порталы</h4>
            <ul>
                <li>Драконы</li>
                <li>Эльфы</li>
                <li>Маги</li>
            </ul>
            <p class="hover">Наведите на карточку</p>
         </aside>
    </div>
</body>
</html>
